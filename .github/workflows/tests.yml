name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install what the gate reads
        run: |
          python -m pip install pyyaml==6.0.3
          npm install -g @anthropic-ai/claude-code@2.1.311
      - name: Validate every plugin and skill
        env:
          VALIDATE_STRICT: "1"
        run: python -B tools/validate.py
